[pytest]
# Pytest configuration for AUTO-ROTO v5

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
minversion = 7.0

# Output and reporting
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-omit=tests/*
    --cov-omit=GroundingDINO/*
    --cov-omit=sam2_repo/*
    --cov-omit=Depth-Anything-V2/*
    --cov-omit=depth-anything-3/*
    -n auto
    --timeout=300
    --capture=no

# Test markers
markers =
    unit: Unit tests (fast, isolated, <1s)
    integration: Integration tests (slower, multi-module, 10-30s)
    slow: Tests taking > 10 seconds
    gpu: Tests requiring GPU/CUDA
    memory: Memory stability tests
    performance: Performance benchmarks
    quality: Output quality validation
    visual: Visual/manual inspection required
    flaky: Known to be flaky, needs investigation
    skip_ci: Skip in CI pipeline (resource intensive)

# Logging
log_cli = false
log_cli_level = INFO
log_file = test_results.log
log_file_level = DEBUG
